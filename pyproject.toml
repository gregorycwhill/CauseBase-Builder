[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "causebase-builder"
version = "0.1.0"
description = "Local production engine for CauseBase"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
  "pydantic>=2.10,<3",
  "pandas>=2.2,<3",
  "pyarrow>=18,<22",
  "pdfplumber>=0.11,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
]

[project.scripts]
causebase = "causebase_builder.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/causebase_builder"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
